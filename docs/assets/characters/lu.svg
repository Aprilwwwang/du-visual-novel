<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f0e5"/>
      <stop offset="100%" stop-color="#eadcc5"/>
    </linearGradient>
    <linearGradient id="hair2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4a3a"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf8"/>
      <stop offset="100%" stop-color="#e8e4dd"/>
    </linearGradient>
  </defs>
  <!-- neck -->
  <rect x="175" y="275" width="50" height="70" rx="10" fill="url(#skin2)"/>
  <!-- shoulders -->
  <path d="M50,370 Q100,330 170,340 L170,500 L50,500 Z" fill="url(#shirt)"/>
  <path d="M350,370 Q300,330 230,340 L230,500 L350,500 Z" fill="url(#shirt)"/>
  <!-- shirt collar -->
  <path d="M155,340 L200,300 L245,340" fill="none" stroke="#d0ccc5" stroke-width="2"/>
  <path d="M170,342 L200,410 L200,500" fill="none" stroke="#d8d4cc" stroke-width="0.8"/>
  <path d="M230,342 L200,410 L200,500" fill="none" stroke="#d8d4cc" stroke-width="0.8"/>
  <!-- tie -->
  <path d="M193,310 L200,305 L207,310 L207,400 Q200,420 193,400 Z" fill="#6a5a4a"/>
  <!-- face -->
  <ellipse cx="200" cy="205" rx="82" ry="108" fill="url(#skin2)"/>
  <path d="M118,205 Q138,305 200,318 Q262,305 282,205" fill="url(#skin2)"/>
  <!-- hair back (neat, mature style) -->
  <path d="M105,195 Q100,90 140,55 Q200,20 260,55 Q300,90 295,195 Q295,240 280,220 Q260,260 240,230 Q200,275 160,230 Q140,260 120,220 Q105,240 105,195 Z" fill="url(#hair2)"/>
  <!-- hair top (side part, neat) -->
  <path d="M108,190 Q110,100 155,60 Q180,45 210,42 Q250,40 285,70 Q298,100 292,180 Q280,165 265,175 Q250,140 210,140 Q175,140 155,165 Q135,175 120,175 Q112,180 108,190 Z" fill="url(#hair2)"/>
  <!-- side hair -->
  <path d="M105,195 Q100,250 105,285 Q108,260 108,240 Z" fill="url(#hair2)"/>
  <path d="M295,195 Q300,250 295,285 Q292,260 292,240 Z" fill="url(#hair2)"/>
  <!-- glasses -->
  <rect x="148" y="212" width="36" height="28" rx="4" fill="none" stroke="#4a4a4a" stroke-width="2.5"/>
  <rect x="216" y="212" width="36" height="28" rx="4" fill="none" stroke="#4a4a4a" stroke-width="2.5"/>
  <line x1="184" y1="224" x2="216" y2="224" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="148" y1="220" x2="132" y2="218" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="252" y1="220" x2="268" y2="218" stroke="#4a4a4a" stroke-width="1.5"/>
  <!-- eyes (behind glasses, warm) -->
  <ellipse cx="166" cy="226" rx="14" ry="8" fill="white"/>
  <ellipse cx="234" cy="226" rx="14" ry="8" fill="white"/>
  <ellipse cx="168" cy="226" rx="7" ry="7" fill="#7a6040"/>
  <ellipse cx="236" cy="226" rx="7" ry="7" fill="#7a6040"/>
  <ellipse cx="169" cy="225" rx="3.5" ry="3.5" fill="#2a1a0a"/>
  <ellipse cx="237" cy="225" rx="3.5" ry="3.5" fill="#2a1a0a"/>
  <!-- eyebrows -->
  <path d="M144,204 Q166,197 185,204" fill="none" stroke="#3a2a1a" stroke-width="2"/>
  <path d="M215,204 Q234,197 256,204" fill="none" stroke="#3a2a1a" stroke-width="2"/>
  <!-- nose -->
  <path d="M198,232 L196,245 Q200,248 204,245" fill="none" stroke="#d0c0a8" stroke-width="1.5"/>
  <!-- mouth (gentle smile) -->
  <path d="M182,265 Q200,275 218,265" fill="none" stroke="#b89878" stroke-width="1.8"/>
  <!-- subtle smile line -->
  <path d="M182,265 Q190,272 200,270" fill="none" stroke="#b89878" stroke-width="1"/>
</svg>
