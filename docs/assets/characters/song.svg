<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="skin6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f0e5"/>
      <stop offset="100%" stop-color="#e8d8c0"/>
    </linearGradient>
    <linearGradient id="hair6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a5a4a"/>
      <stop offset="100%" stop-color="#4a3a2a"/>
    </linearGradient>
  </defs>
  <!-- neck -->
  <rect x="176" y="275" width="48" height="72" rx="9" fill="url(#skin6)"/>
  <!-- shoulders (casual) -->
  <path d="M55,370 Q105,335 168,342 L168,500 L55,500 Z" fill="#4a5568"/>
  <path d="M345,370 Q295,335 232,342 L232,500 L345,500 Z" fill="#4a5568"/>
  <!-- casual collar -->
  <path d="M155,342 L200,300 L245,342" fill="none" stroke="#5a6578" stroke-width="2"/>
  <!-- hoodie/sweater hint -->
  <path d="M155,342 Q140,360 135,380" fill="none" stroke="#3a4558" stroke-width="1.5"/>
  <path d="M245,342 Q260,360 265,380" fill="none" stroke="#3a4558" stroke-width="1.5"/>
  <!-- face (friendly, rounded) -->
  <ellipse cx="200" cy="205" rx="78" ry="100" fill="url(#skin6)"/>
  <path d="M122,205 Q142,298 200,312 Q258,298 278,205" fill="url(#skin6)"/>
  <!-- hair (casual, light brown/warm) -->
  <path d="M108,200 Q105,95 138,58 Q200,25 262,58 Q295,95 292,200 Q295,245 280,218 Q260,265 240,232 Q200,278 160,232 Q140,265 120,218 Q105,245 108,200 Z" fill="url(#hair6)"/>
  <!-- bangs (casual, slightly messy) -->
  <path d="M110,195 Q118,125 152,78 Q178,58 200,52 Q225,56 250,75 Q285,120 290,188 Q275,172 258,180 Q240,142 200,148 Q162,142 145,178 Q128,172 110,195 Z" fill="url(#hair6)"/>
  <!-- eyes (friendly, warm) -->
  <ellipse cx="168" cy="218" rx="15" ry="9" fill="white"/>
  <ellipse cx="232" cy="218" rx="15" ry="9" fill="white"/>
  <ellipse cx="170" cy="218" rx="8" ry="7.5" fill="#5a4a3a"/>
  <ellipse cx="234" cy="218" rx="8" ry="7.5" fill="#5a4a3a"/>
  <ellipse cx="171" cy="217" rx="3.5" ry="3.5" fill="#1a0a00"/>
  <ellipse cx="235" cy="217" rx="3.5" ry="3.5" fill="#1a0a00"/>
  <circle cx="166" cy="215" r="2" fill="white"/>
  <circle cx="230" cy="215" r="2" fill="white"/>
  <!-- eyebrows (relaxed) -->
  <path d="M148,200 Q168,195 188,202" fill="none" stroke="#4a3a2a" stroke-width="2.2"/>
  <path d="M212,202 Q232,195 252,200" fill="none" stroke="#4a3a2a" stroke-width="2.2"/>
  <!-- nose -->
  <path d="M198,226 L195,240 Q200,243 205,240" fill="none" stroke="#d4c0a0" stroke-width="1.5"/>
  <!-- mouth (easy smile) -->
  <path d="M182,258 Q200,270 218,258" fill="none" stroke="#b89070" stroke-width="2"/>
  <!-- hint of smile crease -->
  <path d="M180,258 Q178,262 180,260" fill="none" stroke="#b89070" stroke-width="1"/>
  <path d="M220,258 Q222,262 220,260" fill="none" stroke="#b89070" stroke-width="1"/>
</svg>
