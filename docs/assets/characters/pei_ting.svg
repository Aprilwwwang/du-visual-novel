<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="skin3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef5ed"/>
      <stop offset="100%" stop-color="#f5e5d0"/>
    </linearGradient>
    <linearGradient id="hair3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6b4a"/>
      <stop offset="100%" stop-color="#6b4a2a"/>
    </linearGradient>
    <linearGradient id="uniform2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a3a"/>
      <stop offset="100%" stop-color="#3a2a2a"/>
    </linearGradient>
  </defs>
  <!-- neck -->
  <rect x="178" y="270" width="44" height="70" rx="8" fill="url(#skin3)"/>
  <!-- shoulders (feminine) -->
  <path d="M70,360 Q110,330 165,340 L165,500 L70,500 Z" fill="url(#uniform2)"/>
  <path d="M330,360 Q290,330 235,340 L235,500 L330,500 Z" fill="url(#uniform2)"/>
  <!-- sailor collar -->
  <path d="M150,340 L200,310 L250,340" fill="none" stroke="#5a4a4a" stroke-width="2"/>
  <path d="M165,342 L180,420 L165,500" fill="none" stroke="#3a2a2a" stroke-width="0.8"/>
  <path d="M235,342 L220,420 L235,500" fill="none" stroke="#3a2a2a" stroke-width="0.8"/>
  <!-- ribbon -->
  <path d="M190,315 L200,330 L210,315 L210,350 Q200,360 190,350 Z" fill="#c05050"/>
  <!-- face -->
  <ellipse cx="200" cy="200" rx="75" ry="98" fill="url(#skin3)"/>
  <path d="M125,200 Q145,295 200,308 Q255,295 275,200" fill="url(#skin3)"/>
  <!-- hair back (medium brown, twin tails) -->
  <path d="M110,195 Q105,85 140,50 Q200,15 260,50 Q295,85 290,195 Q295,240 282,215 Q265,260 245,230 Q200,275 155,230 Q135,260 118,215 Q105,240 110,195 Z" fill="url(#hair3)"/>
  <!-- bangs -->
  <path d="M112,190 Q115,120 150,70 Q175,50 200,45 Q225,50 250,70 Q285,120 288,190 Q270,170 255,180 Q235,140 200,145 Q165,140 145,180 Q130,170 112,190 Z" fill="url(#hair3)"/>
  <!-- twin tails -->
  <path d="M112,170 Q85,200 80,260 Q78,290 85,300 Q90,280 95,260 Q100,220 118,200 Z" fill="url(#hair3)"/>
  <path d="M288,170 Q315,200 320,260 Q322,290 315,300 Q310,280 305,260 Q300,220 282,200 Z" fill="url(#hair3)"/>
  <!-- round glasses -->
  <circle cx="168" cy="215" r="16" fill="none" stroke="#5a4a3a" stroke-width="2.2"/>
  <circle cx="232" cy="215" r="16" fill="none" stroke="#5a4a3a" stroke-width="2.2"/>
  <line x1="184" y1="215" x2="216" y2="215" stroke="#5a4a3a" stroke-width="1.8"/>
  <!-- eyes -->
  <ellipse cx="168" cy="218" rx="12" ry="9" fill="white"/>
  <ellipse cx="232" cy="218" rx="12" ry="9" fill="white"/>
  <ellipse cx="169" cy="218" rx="7" ry="7" fill="#5a3a2a"/>
  <ellipse cx="233" cy="218" rx="7" ry="7" fill="#5a3a2a"/>
  <ellipse cx="170" cy="217" rx="3" ry="3" fill="#1a0a00"/>
  <ellipse cx="234" cy="217" rx="3" ry="3" fill="#1a0a00"/>
  <circle cx="166" cy="214" r="1.8" fill="white"/>
  <circle cx="230" cy="214" r="1.8" fill="white"/>
  <!-- eyebrows (gentle) -->
  <path d="M148,195 Q168,190 184,197" fill="none" stroke="#5a3a2a" stroke-width="2"/>
  <path d="M216,197 Q232,190 252,195" fill="none" stroke="#5a3a2a" stroke-width="2"/>
  <!-- nose -->
  <path d="M198,225 L196,238 Q200,241 204,238" fill="none" stroke="#e0c8a8" stroke-width="1.2"/>
  <!-- mouth (gentle smile) -->
  <path d="M185,252 Q200,262 215,252" fill="none" stroke="#c09070" stroke-width="1.8"/>
  <!-- blush -->
  <ellipse cx="150" cy="240" rx="14" ry="8" fill="#f0c0b0" opacity="0.3"/>
  <ellipse cx="250" cy="240" rx="14" ry="8" fill="#f0c0b0" opacity="0.3"/>
</svg>
